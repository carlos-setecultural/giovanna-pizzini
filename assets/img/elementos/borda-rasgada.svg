<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="none">
  <!-- Máscara de borda rasgada. Não é um desenho: é um retângulo branco
       passado por um filtro de ruído que empurra cada ponto da borda
       para dentro ou para fora. O miolo fica branco e opaco, então a
       fotografia por baixo não muda; só o contorno fica irregular,
       como papel rasgado ou traço de carvão.
       Usada em mask-image — o branco mostra, o preto esconde. -->
  <filter id="rasga" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022" numOctaves="4" seed="11" result="ruido"/>
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="0.7"/>
  </filter>
  <rect x="7" y="7" width="186" height="186" fill="#fff" filter="url(#rasga)"/>
</svg>
